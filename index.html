<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giao Diện Tác Nghiệp Nhân Viên</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #1a73e8;
      --success: #34a853;
      --warning: #fbbc05;
      --bg: #f8f9fa;
      --card: #ffffff;
      --border: #e0e0e0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }

    /* Khung thông tin cá nhân nhân viên */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-box {
      background: var(--primary);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
    }

    .profile-info h3 { margin: 0; font-size: 16px; color: #202124; }
    .profile-info p { margin: 3px 0 0 0; font-size: 12px; color: #5f6368; }

    /* Danh sách công việc */
    .job-title {
      font-size: 15px;
      font-weight: 600;
      color: #3c4043;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .job-item {
      background: #fdfdfd;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .job-name {
      font-weight: 600;
      font-size: 14px;
      color: #202124;
      margin-bottom: 10px;
    }

    /* Nhóm nút tác vụ */
    .action-group {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-start { background-color: #e8f0fe; color: var(--primary); }
    .btn-start:hover { background-color: #d2e3fc; }
    
    .btn-complete { background-color: #e6f4ea; color: var(--success); }
    .btn-complete:hover { background-color: #ceead6; }

    /* Lịch sử thời gian */
    .history-box {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .history-title {
      font-size: 11px;
      color: #70757a;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .history-log {
      font-size: 12px;
      color: #3c4043;
      margin: 3px 0;
      display: flex;
      justify-content: space-between;
    }

    .badge-start { color: var(--primary); font-weight: 500; }
    .badge-done { color: var(--success); font-weight: 500; }
    
    .loading-text { text-align: center; color: #888; font-size: 13px; padding: 20px 0; }
  </style>
</head>
<body>

<div class="app-container">

  <div class="card profile-header">
    <div class="avatar-box"><i class="fas fa-user"></i></div>
    <div class="profile-info">
      <h3 id="emp-name">Đang tải tên...</h3>
      <p id="emp-meta">Mã số: ... | Dự án: ...</p>
    </div>
  </div>

  <div class="card">
    <div class="job-title">
      <i class="fas fa-map-marker-alt" style="color: #ea4335;"></i>
      <span>Khu vực phân công: <b id="text-current-area">Đang xác định...</b></span>
    </div>
    
    <div id="container-job-list">
      <div class="loading-text"><i class="fas fa-spinner fa-spin"></i> Đang đọc danh sách đầu việc được giao...</div>
    </div>
  </div>

</div>

<script>
  // CẤU HÌNH BIẾN TOÀN CỤC
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxuQcFZ1sh2_yz7sZbn0y8cD4dLjuZ8i8oa9VLLNdKgS9K-27qjsiGubQVlHmLVYOno/exec";
  
  // Giả lập thông tin nhân viên đăng nhập từ hệ thống (Ví dụ: Chị Liên đăng nhập vào dự án Mipec Rubik)
  let SESSION = {
    staffId: "111000",
    staffName: "Chu Thị Bích Liên",
    project: "Mipec Rubik"
  };

  // Biến chứa toàn bộ cơ sở dữ liệu và lịch sử tạm thời trên bộ nhớ Web
  let DB_PROJECT_TREE = {}; 
  let WORK_HISTORY = []; 

  // 1. TỰ ĐỘNG CHẠY KHI TẢI TRANG
  window.onload = function() {
    setupEmployeeProfile();
    loadWorkDataFromServer();
  };

  // Hiển thị thông tin nhân viên lên thanh đầu trang
  function setupEmployeeProfile() {
    document.getElementById("emp-name").innerText = SESSION.staffName.toUpperCase();
    document.getElementById("emp-meta").innerText = `Mã số: ${SESSION.staffId} | Dự án: ${SESSION.project}`;
  }

  // 2. LẤY DỮ LIỆU CÔNG VIỆC & LỊCH SỬ TỪ GOOGLE SHEETS
  function loadWorkDataFromServer() {
    const url = `${GAS_URL}?action=getInitData&_=${new Date().getTime()}`;
    
    fetch(url)
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          DB_PROJECT_TREE = res.data.project_tree || {};
          
          // Giả định nếu trong danh sách tổng có trả về lịch sử làm việc cũ từ tab phan_cong_data/lich_su_lam_viec
          WORK_HISTORY = res.data.work_logs || []; 
          
          renderJobDashboard();
        }
      })
      .catch(err => {
        console.error("Lỗi đồng bộ máy chủ: ", err);
        document.getElementById("container-job-list").innerHTML = '<p class="loading-text" style="color:red;">Lỗi kết nối dữ liệu mạng!</p>';
      });
  }

  // 3. TỰ ĐỘNG PHÂN TÍCH KHU VỰC VÀ HIỂN THỊ CHI TIẾT CÁC CÔNG VIỆC CỦA KHU VỰC ĐÓ
  function renderJobDashboard() {
    const listContainer = document.getElementById("container-job-list");
    const areaTextElement = document.getElementById("text-current-area");
    
    const projectData = DB_PROJECT_TREE[SESSION.project];
    
    if (!projectData || Object.keys(projectData).length === 0) {
      areaTextElement.innerText = "Chưa cấu hình";
      listContainer.innerHTML = '<div class="loading-text">Dự án hiện tại chưa được lập danh mục công việc nào.</div>';
      return;
    }

    // Lấy tên khu vực đầu tiên được phân công tìm thấy trong dữ liệu dự án của Sheets
    const currentArea = Object.keys(projectData)[0]; 
    areaTextElement.innerText = currentArea;

    // Lấy danh sách các mảng công việc chi tiết nằm bên trong khu vực đó (Ví dụ: Quét dọn sảnh, lau sàn...)
    const jobs = projectData[currentArea] || [];
    
    if (jobs.length === 0) {
      listContainer.innerHTML = '<div class="loading-text">Khu vực này không có đầu việc nào cần thực hiện.</div>';
      return;
    }

    listContainer.innerHTML = ""; // Xóa dòng chữ Loading ẩn

    // Duyệt qua từng công việc để vẽ giao diện kèm nút chức năng tương ứng
    jobs.forEach((jobName, index) => {
      // Lọc danh sách lịch sử nhấn nút của riêng công việc này để hiển thị ra màn hình
      const jobLogs = WORK_HISTORY.filter(log => log.KhuVuc === currentArea && log.CongViec === jobName && log.MaNV === SESSION.staffId);
      
      let historyHtml = "";
      if (jobLogs.length > 0) {
        historyHtml = `<div class="history-box"><div class="history-title">Nhật ký thực hiện:</div>`;
        jobLogs.forEach(log => {
          const badgeClass = log.TrangThai === "Bắt đầu" ? "badge-start" : "badge-done";
          historyHtml += `
            <div class="history-log">
              <span class="${badgeClass}"><i class="far fa-clock"></i> ${log.TrangThai}</span>
              <span style="color:#70757a;">${log.ThoiGianNhan}</span>
            </div>`;
        });
        historyHtml += `</div>`;
      }

      // Tạo chuỗi HTML cấu trúc thẻ công việc
      const cardHtml = `
        <div class="job-item" id="job-card-${index}">
          <div class="job-name">${index + 1}. ${jobName}</div>
          <div class="action-group">
            <button class="btn-action btn-start" onclick="triggerWorkStatus('${currentArea}', '${jobName}', 'Bắt đầu', this)">
              <i class="fas fa-play"></i> Bắt đầu
            </button>
            <button class="btn-action btn-complete" onclick="triggerWorkStatus('${currentArea}', '${jobName}', 'Hoàn thành', this)">
              <i class="fas fa-check-double"></i> Hoàn thành
            </button>
          </div>
          <div id="log-zone-${index}">${historyHtml}</div>
        </div>
      `;
      listContainer.innerHTML += cardHtml;
    });
  }

  // 4. XỬ LÝ SỰ KIỆN GỬI THỜI GIAN THỰC LÊN GOOGLE SHEETS KHI NHÂN VIÊN NHẤN NÚT
  function triggerWorkStatus(area, jobName, status, buttonElement) {
    // Tạm khóa nút vừa nhấn để tránh việc người dùng bấm liên tục nhiều lần bị trùng lệnh
    const originalText = buttonElement.innerHTML;
    buttonElement.disabled = true;
    buttonElement.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang ghi...`;

    // Tạo gói dữ liệu chuẩn gửi đi
    const params = new URLSearchParams();
    params.append("action", "logWorkTime");
    params.append("project", SESSION.project);
    params.append("area", area);
    params.append("job", jobName);
    params.append("staffId", SESSION.staffId);
    params.append("staffName", SESSION.staffName);
    params.append("status", status);

    fetch(GAS_URL, {
      method: "POST",
      body: params,
      headers: { "Content-Type": "application/x-www-form-urlencoded" }
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        // Nối mốc thời gian phản hồi thực tế từ Google Sheet vào danh sách lịch sử cục bộ
        WORK_HISTORY.push({
          KhuVuc: area,
          CongViec: jobName,
          MaNV: SESSION.staffId,
          TrangThai: status,
          ThoiGianNhan: res.time
        });
        
        // Vẽ lại danh sách để cập nhật bảng nhật ký thời gian ngay tức thì dưới chân thẻ việc
        renderJobDashboard();
      } else {
        alert("Có lỗi xảy ra từ máy chủ: " + res.message);
      }
    })
    .catch(err => {
      console.error("Lỗi mạng: ", err);
      alert("Mạng không ổn định, không thể ghi nhận mốc thời gian thực!");
    })
    .finally(() => {
      // Mở khóa lại nút bấm sau khi thao tác thành công
      buttonElement.disabled = false;
      buttonElement.innerHTML = originalText;
    });
  }
</script>

</body>
</html>
