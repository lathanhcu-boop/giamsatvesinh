<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Điều Hành Đa Dự Án</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #1a73e8;
      --bg-color: #f0f4f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dadce0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
    }

    /* Giao diện khung hộp */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 24px;
      margin-bottom: 20px;
    }

    .header-box {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      text-align: center;
      padding: 20px;
      border-radius: 12px 12px 0 0;
      margin: -24px -24px 24px -24px;
    }

    .header-box h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
    }

    .header-box p {
      margin: 0;
      font-size: 13px;
      opacity: 0.8;
    }

    /* Thẻ thông tin người dùng đăng nhập */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #ffffff;
      border: 1px solid var(--border-color);
    }

    .user-avatar {
      background: var(--primary-color);
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .user-info h4 {
      margin: 0;
      color: var(--primary-color);
    }

    .user-info p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: #666;
    }

    /* Tab điều hướng */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 20px;
      gap: 15px;
    }

    .tab-item {
      padding: 10px 5px;
      cursor: pointer;
      font-weight: 600;
      color: #666;
      border-bottom: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-item.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    /* Biểu mẫu nhóm nhập liệu */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .btn-group-roles {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .role-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-color);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .role-btn.active {
      background: #e8f0fe;
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    button.btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    button.btn-submit:hover {
      background: #1557b0;
    }

    /* Ẩn hiện màn hình */
    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="view-login" class="card view-section active">
    <div class="header-box">
      <h2>HỆ THỐNG ĐIỀU HÀNH ĐA DỰ ÁN</h2>
      <p>Phiên bản Web cao cấp - Tối ưu hóa vận hành & Khóa dữ liệu</p>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-map-location-dot"></i> BƯỚC 1: CHỌN DỰ ÁN LÀM VIỆC</label>
      <select id="login-project">
        <option value="">-- Đang kết nối cơ sở dữ liệu... --</option>
      </select>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-user-shield"></i> BƯỚC 2: CHỌN VAI TRÒ TRUY CẬP</label>
      <div class="btn-group-roles">
        <button type="button" class="role-btn" onclick="selectRole('Nhân viên')"><i class="fa-solid fa-user"></i> Nhân viên</button>
        <button type="button" class="role-btn active" onclick="selectRole('Giám sát')"><i class="fa-solid fa-user-tie"></i> Giám sát</button>
        <button type="button" class="role-btn" onclick="selectRole('Cư dân')"><i class="fa-solid fa-house-user"></i> Cư dân</button>
      </div>
    </div>

    <div class="form-group">
      <label id="label-identity">Mã số nhân viên:</label>
      <input type="text" id="login-identity" placeholder="Nhập mã nhân viên (Ví dụ: 111000, NV01)">
    </div>

    <button class="btn-submit" onclick="handleLogin()"><i class="fa-solid fa-right-to-bracket"></i> Xác thực thông tin truy cập</button>
  </div>


  <div id="view-main" class="view-section">
    
    <div class="card user-profile">
      <div class="user-avatar">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <div class="user-info">
        <p style="margin:0; font-size:11px; color:#aaa; text-transform:uppercase; font-weight:bold;" id="txt-role-display">GIÁM SÁT TRƯỞNG</p>
        <h4 id="txt-username-display">LATHANHCU</h4>
        <p id="txt-project-display"><i class="fa-solid fa-building"></i> Dự án vận hành: Mipec Rubik</p>
      </div>
    </div>

    <div class="tabs">
      <div class="tab-item" id="tab-monitor" onclick="switchTab('monitor')"><i class="fa-solid fa-tower-broadcast"></i> Theo dõi trực tuyến</div>
      <div class="tab-item active" id="tab-assign" onclick="switchTab('assign')"><i class="fa-solid fa-user-plus"></i> Giao phân công công việc</div>
    </div>

    <div id="content-monitor" class="card view-section">
      <p style="text-align: center; color: #888;"><i class="fa-solid fa-spinner fa-spin"></i> Tính năng theo dõi dữ liệu trực tuyến đang được đồng bộ...</p>
    </div>

    <div id="content-assign" class="card view-section active">
      <h3 style="margin-top:0; color: #333; font-size:16px; border-bottom:1px solid #eee; padding-bottom:10px;">
        <i class="fa-solid fa-paste"></i> LẬP LỆNH PHÂN CÔNG ĐIỀU HÀNH
      </h3>
      
      <div class="form-group">
        <label>Chọn Khu vực chuẩn:</label>
        <select id="assign-area">
          <option value="">-- Đang tải dữ liệu khu vực... --</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Nhân viên thực hiện:</label>
        <input type="text" id="assign-staff" list="staff-suggestions" placeholder="Nhập tên hoặc mã nhân viên để tìm kiếm...">
        <datalist id="staff-suggestions"></datalist>
      </div>
      
      <button class="btn-submit" onclick="submitAssignment()"><i class="fa-solid fa-paper-plane"></i> Phát lệnh phân công ngay</button>
    </div>

    <button style="background:none; border:none; color:#888; cursor:pointer; text-decoration:underline; font-size:13px;" onclick="logout()"><i class="fa-solid fa-arrow-left"></i> Đăng xuất hệ thống</button>
  </div>

</div>

<script>
  // CẤU HÌNH LIÊN KẾT: Thay thế link bên dưới bằng link Web App Google Apps Script của bạn
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxzEcHa3MFSN-bWkOuUCjsnPY_wEcu3-vQJ-NW3CphptLUCBdfIa8iX_YzuoAz4mgOK/exec";

  // Bộ nhớ đệm dữ liệu ứng dụng toàn cục
  let DB = { projects: [], nv: [], project_tree: {} };
  let SESSION = { role: "Giám sát", identity: "", project: "", name: "" };

  // 1. TỰ ĐỘNG TẢI DỮ LIỆU TỪ GOOGLE SHEETS NGAY KHI MỞ TRANG
  function fetchMasterData() {
    if (!GAS_URL) {
      alert("Chưa cấu hình link GAS_URL! Vui lòng kiểm tra lại mã nguồn.");
      return;
    }
    
    // Đuôi mốc thời gian chống dính Cache trình duyệt (Anti-cache)
    const urlWithAntiCache = `${GAS_URL}?action=getInitData&_=${new Date().getTime()}`;
    
    fetch(urlWithAntiCache)
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          DB = res.data;
          buildProjectSelectOptions(); // Nạp dự án vào danh sách đăng nhập
        } else {
          alert("Lỗi nạp cơ sở dữ liệu: " + res.message);
        }
      })
      .catch(err => {
        console.error("Lỗi API kết nối hệ thống: ", err);
        alert("Không thể kết nối với máy chủ Google Apps Script!");
      });
  }

  // 2. XÂY DỰNG DANH SÁCH CHỌN DỰ ÁN TẠI GIAO DIỆN ĐĂNG NHẬP
  function buildProjectSelectOptions() {
    const select = document.getElementById("login-project");
    if (!select) return;
    
    // Lấy mảng key dự án từ object project_tree
    const projects = Object.keys(DB.project_tree || {});
    
    if (projects.length === 0) {
      select.innerHTML = '<option value="">-- Không có dữ liệu dự án --</option>';
      return;
    }
    
    select.innerHTML = "";
    projects.forEach(p => {
      select.innerHTML += `<option value="${p}">${p}</option>`;
    });
  }

  // 3. XỬ LÝ SỰ KIỆN THAY ĐỔI VAI TRÒ TRÊN GIAO DIỆN ĐĂNG NHẬP
  function selectRole(role) {
    SESSION.role = role;
    
    // Thay đổi trạng thái active của nút bấm vai trò
    document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    // Đổi nhãn chỉ dẫn tương ứng theo vai trò
    const label = document.getElementById("label-identity");
    const input = document.getElementById("login-identity");
    
    if (role === "Cư dân") {
      label.innerText = "Số phòng khách hàng:";
      input.placeholder = "Nhập số căn hộ/phòng của cư dân";
    } else {
      label.innerText = "Mã số nhân viên:";
      input.placeholder = "Nhập mã nhân viên (Ví dụ: 111000, NV01)";
    }
  }

  // 4. LOGIC XỬ LÝ ĐĂNG NHẬP & CHUYỂN MÀN HÌNH ĐIỀU HÀNH
  function handleLogin() {
    const selectedProj = document.getElementById("login-project").value;
    const identityVal = document.getElementById("login-identity").value.trim();
    
    if (!selectedProj) {
      alert("Vui lòng chọn một Dự án để làm việc!");
      return;
    }
    if (!identityVal) {
      alert("Vui lòng nhập Mã định danh xác thực truy cập!");
      return;
    }
    
    SESSION.project = selectedProj;
    SESSION.identity = identityVal;
    SESSION.name = identityVal; // Mặc định hiển thị tên tạm bằng ID nhập vào

    // Lọc tìm tên thật từ danh sách nhân viên nếu có trùng khớp mã
    if (DB.nv && Array.isArray(DB.nv)) {
      const matchStaff = DB.nv.find(emp => emp.DuAn === selectedProj && emp.MaNV.toString() === identityVal);
      if (matchStaff) {
        SESSION.name = matchStaff.HoTen;
      }
    }

    // Hiển thị thông tin hồ sơ phiên làm việc lên màn hình chính
    document.getElementById("txt-role-display").innerText = SESSION.role + " trường";
    document.getElementById("txt-username-display").innerText = SESSION.name.toUpperCase();
    document.getElementById("txt-project-display").innerHTML = `<i class="fa-solid fa-building"></i> Dự án vận hành: <b>${SESSION.project}</b>`;
    
    // Đồng bộ ngay lập tức các ô chọn Khu vực và Gợi ý nhân viên riêng biệt của Dự án này
    refreshPanelViews();
    
    // Đổi view màn hình
    document.getElementById("view-login").classList.remove("active");
    document.getElementById("view-main").classList.add("active");
  }

  // 5. CHỨC NĂNG SỬA LỖI: CẬP NHẬT ĐỘNG KHU VỰC VÀ BỘ GỢI Ý TÌM KIẾM NHÂN VIÊN
  function refreshPanelViews() {
    const currentProject = SESSION.project;
    if (!currentProject) return;

    // --- A. CẬP NHẬT DANH SÁCH CÁC KHU VỰC CỦA RIÊNG DỰ ÁN ---
    const areaSelect = document.getElementById("assign-area");
    if (areaSelect) {
      areaSelect.innerHTML = '<option value="">-- Chọn khu vực --</option>';
      
      if (DB.project_tree && DB.project_tree[currentProject]) {
        const areas = Object.keys(DB.project_tree[currentProject]);
        
        if (areas.length > 0) {
          areas.forEach(area => {
            if (area) {
              areaSelect.innerHTML += `<option value="${area}">${area}</option>`;
            }
          });
        } else {
          areaSelect.innerHTML = '<option value="">-- Dự án này chưa cấu hình phân khu --</option>';
        }
      }
    }

    // --- B. TẠO BỘ TỰ ĐỘNG GỢI Ý/TÌM KIẾM NHÂN VIÊN (AUTO-COMPLETE) THEO DỰ ÁN ---
    const staffDatalist = document.getElementById("staff-suggestions");
    const staffInput = document.getElementById("assign-staff");
    
    if (staffDatalist) {
      staffDatalist.innerHTML = ""; // Xóa dữ liệu gợi ý của phiên trước
      if (staffInput) staffInput.value = ""; // Đặt lại ô nhập về trống rỗng
      
      if (DB.nv && Array.isArray(DB.nv)) {
        // Lọc chính xác danh sách nhân viên thuộc dự án đang chọn
        const filteredStaffs = DB.nv.filter(emp => emp.DuAn === currentProject && emp.MaNV);
        
        filteredStaffs.forEach(staff => {
          // Định dạng ghép chuỗi: "Mã Số - Tên Gọi" -> Thuận tiện tìm kiếm bằng cả Tên hoặc Mã
          const suggestionValue = `${staff.MaNV} - ${staff.HoTen}`;
          staffDatalist.innerHTML += `<option value="${suggestionValue}"></option>`;
        });
      }
    }
  }

  // 6. CHUYỂN ĐỔI TAB LÀM VIỆC TRÊN MÀN HÌNH CHÍNH
  function switchTab(tabName) {
    document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
    document.getElementById('content-monitor').classList.remove('active');
    document.getElementById('content-assign').classList.remove('active');
    
    document.getElementById(`tab-${tabName}`).classList.add('active');
    document.getElementById(`content-${tabName}`).classList.add('active');
  }

  // 7. XỬ LÝ SỰ KIỆN PHÁT LỆNH PHÂN CÔNG
  function submitAssignment() {
    const area = document.getElementById("assign-area").value;
    const staffText = document.getElementById("assign-staff").value.trim();
    
    if (!area) {
      alert("Vui lòng chọn Khu vực chuẩn trước khi phát lệnh!");
      return;
    }
    if (!staffText) {
      alert("Vui lòng nhập hoặc chọn Nhân viên thực hiện lệnh!");
      return;
    }
    
    alert(`⚡ LỆNH ĐIỀU HÀNH ĐÃ ĐƯỢC PHÁT:\n- Dự án: ${SESSION.project}\n- Khu vực: ${area}\n- Nhân sự phụ trách: ${staffText}`);
  }

  // 8. ĐĂNG XUẤT QUAY LẠI MÀN HÌNH ĐĂNG NHẬP
  function logout() {
    document.getElementById("view-main").classList.remove("active");
    document.getElementById("view-login").classList.add("active");
    document.getElementById("login-identity").value = "";
  }

  // Kích hoạt chạy tải dữ liệu Google Sheets ngay khi trình duyệt đọc xong file HTML này
  window.onload = function() {
    fetchMasterData();
  };
</script>

</body>
</html>
